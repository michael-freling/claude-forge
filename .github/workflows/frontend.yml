name: Frontend

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'proto/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - 'proto/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Set up buf
      uses: bufbuild/buf-action@v1
      with:
        setup_only: true

    - name: Check generated client is in sync with proto
      run: |
        npm run generate
        if ! git diff --exit-code -- src/gen; then
          echo "Error: frontend/src/gen is out of sync with proto/; run 'npm run generate' and commit"
          exit 1
        fi

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    # Vitest enforces 95% statement/branch/function/line thresholds in its
    # coverage config; the run fails below them. NEVER lower the thresholds.
    - name: Unit and component tests (coverage >= 95%)
      run: npm test

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Playwright component playbook
      run: npm run test:e2e

    - name: Build
      run: npm run build
