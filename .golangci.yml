version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Dead code detection (replaces deprecated deadcode and varcheck)
    - unused
    # Detects unused assignments
    - ineffassign
    # Static analysis
    - staticcheck
  exclusions:
    # Skip generated code. `generated: lax` (the default) already drops files
    # with a "// Code generated ... DO NOT EDIT." header (the protobuf/connect
    # and mock output), but the path rule makes the intent explicit for the
    # buf-generated tree.
    generated: lax
    paths:
      - internal/gen

formatters:
  enable:
    # Import formatting
    - goimports
